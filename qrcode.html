<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NeoWise QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #fff; font-family: sans-serif; }
        #qrcode { margin: 20px; }
        h1 { font-size: 1.2rem; color: #333; }
        p { color: #666; margin-top: 10px; }
        .download-btn { margin-top: 20px; padding: 12px 24px; background: #1E3A5F; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .download-btn:hover { background: #2a4f7f; }
    </style>
</head>
<body>
    <h1>炘智科技 NEOWISE TECHNOLOGY</h1>
    <div id="qrcode"></div>
    <p>掃描 QR Code 前往 neowise.com.tw</p>
    <button class="download-btn" onclick="downloadQR()">下載 QR Code 圖片</button>

    <script>
        var qr = new QRCode(document.getElementById("qrcode"), {
            text: "https://neowise.com.tw",
            width: 512,
            height: 512,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        function downloadQR() {
            var canvas = document.querySelector('#qrcode canvas');
            var link = document.createElement('a');
            link.download = 'neowise-qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
